name: Release xb-element

on:
  push:
    branches:
      - main
    paths:
      - 'packages/xbElement/**'
      - '.changeset/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/release-xb-element.yml'
  # changesets 发版 PR 由 GITHUB_TOKEN 创建，合并后产生的 push 事件
  # 不一定会触发 workflow（GitHub 的防递归限制），因此额外监听 PR 关闭事件。
  pull_request:
    types:
      - closed
    branches:
      - main
  # 兜底：可以在 Actions 页面手动执行一次发版
  workflow_dispatch:

concurrency:
  # 固定分组，避免 push 与 pull_request 对同一版本并发发布
  group: release-xb-element
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository_owner != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'changeset-release/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PR 关闭事件用真正的合并提交；push / 手动执行用本次 SHA
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          # changesets 需要完整历史来创建并推送版本 tag
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          publish: pnpm run release
          title: 'chore: release xb-element'
          commit: 'chore: release xb-element'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
