<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>cascadeLayer</title>
    <style>
        /* 1. 为什么需要 Cascade Layer？ */
        .button {
          color: blue;
        }

        .page .content .button {
          color: red;
        }

        .button.primary {
          color: green !important;
        }

        /* 2. 基本语法 */
        @layer reset {
          button {
            border: none;
            background: none;
          }
        }

        @layer components {
          .button {
            color: #fff;
            background: #1677ff;
          }
        }

        /* 2. 基本语法 */
        @layer components {
          .button {
            padding: 8px 16px;
          }
        }

        @layer components {
          .card {
            padding: 16px;
          }
        }

        /* 3. 层的顺序 */
        @layer reset, base, components, utilities;

        /* 3. 层的顺序 */
        @layer reset, components;

        @layer reset {
          button {
            color: black;
          }
        }

        @layer components {
          button {
            color: blue;
          }
        }

        /* 4. Layer 与选择器优先级的关系 */
        @layer base, components;

        @layer base {
          #app .button {
            color: red;
          }
        }

        @layer components {
          .button {
            color: blue;
          }
        }

        /* 5. 未分层样式的优先级 */
        @layer components {
          .button {
            color: blue;
          }
        }

        .button {
          color: red;
        }

        /* 6. 与 !important 的关系 */
        @layer reset, components;

        @layer reset {
          .button {
            color: red !important;
          }
        }

        @layer components {
          .button {
            color: blue !important;
          }
        }

        /* 7. 导入第三方样式 */
        @layer reset, vendor, components, utilities;

        @import url('./normalize.css') layer(reset);
        @import url('./third-party.css') layer(vendor);

        /* 7. 导入第三方样式 */
        @layer components {
          .button {
            color: #1677ff;
          }
        }

        /* 8. 推荐分层方案 */
        @layer reset, base, tokens, components, utilities, overrides;

        /* 8. 推荐分层方案 */
        @layer reset, base, tokens, components, utilities, overrides;

        @layer tokens {
          :root {
            --color-primary: #1677ff;
          }
        }

        @layer components {
          .button {
            background: var(--color-primary);
          }
        }

        @layer utilities {
          .mt-16 {
            margin-top: 16px;
          }
        }

        /* 9.1 Layer 不是作用域隔离 */
        @layer components {
          .title {
            color: red;
          }
        }

        /* 9.2 Layer 不能替代合理命名 */
        @layer components {
          .item {
            color: red;
          }
        }

        /* 9.3 不要随处声明层顺序 */
        @layer reset, base, tokens, components, utilities, overrides;
    </style>
</head>
<body>
    <h3>2. 基本语法（@layer）</h3>
    <button class="button" style="padding:8px 16px;">button</button>
    <div class="card" style="border:1px solid #ccc;padding:10px;margin-top:8px;">card</div>

    <h3>5. 未分层样式优先级更高</h3>
    <p>未分层的 .button{color:red} 覆盖 @layer 里的 .button{color:blue} → 按钮文字是红色</p>
    <button class="button" style="padding:8px 16px;">按钮（未分层红覆盖分层蓝）</button>

    <h3>8. 推荐分层方案（tokens/components/utilities）</h3>
    <button class="button" style="padding:8px 16px;border:none;">分层按钮</button>
    <div class="mt-16" style="background:#eee;padding:8px;">utilities 层的 .mt-16</div>
</body>
</html>
