<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>flexibleBox</title>
    <style>
        /* 1. Flex 布局是什么？ */
        .box {
          display: flex;
        }

        /* 1. Flex 布局是什么？ */
        .box {
          display: inline-flex;
        }

        /* 1. Flex 布局是什么？ */
        .box {
          display: -webkit-flex; /* Safari */
          display: flex;
        }

        /* 3.1 flex-direction 属性 */
        .box {
          flex-direction: row | row-reverse | column | column-reverse;
        }

        /* 3.2 flex-wrap 属性 */
        .box {
          flex-wrap: nowrap | wrap | wrap-reverse;
        }

        /* 3.3 flex-flow 属性 */
        .box {
          flex-flow: <flex-direction> || <flex-wrap>;
        }

        /* 3.4 justify-content 属性 */
        .box {
          justify-content: flex-start | flex-end | center | space-between | space-around;
        }

        /* 3.5 align-items 属性 */
        .box {
          align-items: flex-start | flex-end | center | baseline | stretch;
        }

        /* 3.6 align-content 属性 */
        .box {
          align-content: flex-start | flex-end | center | space-between | space-around |
            stretch;
        }

        /* 4.1 order 属性 */
        .item {
          order: <integer>;
        }

        /* 4.2 flex-grow 属性 */
        .item {
          flex-grow: <number>; /* default 0 */
        }

        /* 4.3 flex-shrink 属性(不换行才有效) */
        .item {
          flex-shrink: <number>; /* default 1 */
        }

        /* 4.4 flex-basis 属性 */
        .item {
          flex-basis: <length> | auto; /* default auto */
        }

        /* 4.5 flex 属性 */
        .item {
          flex: none | [ < 'flex-grow' > < 'flex-shrink' >? || < 'flex-basis' >];
        }

        /* 4.6 align-self 属性 */
        .item {
          align-self: auto | flex-start | flex-end | center | baseline | stretch;
        }
    </style>
</head>
<body>
    <h3>1. Flex 容器（display:flex）</h3>
    <div class="box" style="gap:8px;">
      <div style="background:#1677ff;color:#fff;padding:10px;">1</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">2</div>
      <div style="background:#faad14;color:#fff;padding:10px;">3</div>
    </div>

    <h3>3.4 justify-content: space-between</h3>
    <div class="box" style="justify-content:space-between;background:#eee;padding:8px;">
      <div style="background:#1677ff;color:#fff;padding:10px;">A</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">B</div>
      <div style="background:#faad14;color:#fff;padding:10px;">C</div>
    </div>

    <h3>3.5 align-items: center</h3>
    <div class="box" style="align-items:center;height:100px;background:#eee;gap:8px;">
      <div style="background:#1677ff;color:#fff;padding:10px;">item</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">item</div>
    </div>

    <h3>4.2 flex-grow（1 vs 2）</h3>
    <div class="box" style="gap:8px;">
      <div class="item" style="flex-grow:1;background:#1677ff;color:#fff;padding:10px;">grow 1</div>
      <div class="item" style="flex-grow:2;background:#52c41a;color:#fff;padding:10px;">grow 2</div>
    </div>

    <h3>4.5 flex 简写（flex:1）</h3>
    <div class="box" style="gap:8px;">
      <div class="item" style="flex:1;background:#1677ff;color:#fff;padding:10px;">flex:1</div>
      <div class="item" style="flex:1;background:#52c41a;color:#fff;padding:10px;">flex:1</div>
    </div>
</body>
</html>
