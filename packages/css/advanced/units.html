<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>units</title>
    <style>
        /* 3. 容器查询单位 (Container Query Units) */
        .card {
          container-type: inline-size;
        }
        .card h2 {
          font-size: 5cqi; /* 标题字号永远是卡片宽度的 5% */
        }

        /* 5.3 rem 应该设为多少 px 方便计算？ */
        html {
          font-size: 62.5%;
        }
        body {
          font-size: 1.6rem; /* 恢复回 16px */
        }

        /* 5.6 怎么做等比例缩放的盒子（宽:高 = 16:9）？ */
        .box {
          width: 100%;
          padding-top: 56.25%; /* 9 / 16 = 0.5625 */
          height: 0;
        }

        /* 5.6 怎么做等比例缩放的盒子（宽:高 = 16:9）？ */
        .box {
          width: 100%;
          aspect-ratio: 16 / 9; /* 直接写比例，现代浏览器全支持 */
        }
    </style>
</head>
<body>
    <h3>3. 容器查询单位 cqi</h3>
    <div class="card" style="container-type:inline-size;width:300px;border:1px solid #ccc;padding:10px;">
      <h2>字号随卡片宽度缩放（5cqi）</h2>
    </div>

    <h3>5.3 rem 计算（html 62.5%，1.6rem=16px）</h3>
    <p>正文默认 1.6rem</p>

    <h3>5.6 等比例 16:9 盒子（aspect-ratio）</h3>
    <div class="box" style="max-width:320px;background:#1677ff;"></div>
</body>
</html>
