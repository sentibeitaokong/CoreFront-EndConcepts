<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>grid</title>
    <style>
        /* 3.1 display 属性 */
        div {
          display: grid;
        }

        /* 3.1 display 属性 */
        div {
          display: inline-grid;
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: 100px 100px 100px;
          grid-template-rows: 100px 100px 100px;
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: 33.33% 33.33% 33.33%;
          grid-template-rows: 33.33% 33.33% 33.33%;
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: repeat(3, 33.33%);
          grid-template-rows: repeat(3, 33.33%);
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        grid-template-columns: repeat(2, 100px 20px 80px);

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: repeat(auto-fill, 100px);
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: 1fr 1fr;
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: 150px 1fr 2fr;
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        grid-template-columns: 1fr 1fr minmax(100px, 1fr);

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        grid-template-columns: 100px auto 100px;

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: [c1] 100px [c2] 100px [c3] auto [c4];
          grid-template-rows: [r1] 100px [r2] 100px [r3] auto [r4];
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        .wrapper {
          display: grid;
          grid-template-columns: 70% 30%;
        }

        /* 3.2 grid-template-columns 属性， grid-template-rows 属性 */
        grid-template-columns: repeat(12, 1fr);

        /* 3.3 gap 属性 */
        .container {
          row-gap: 20px;
          column-gap: 20px;
        }

        /* 3.3 gap 属性 */
        gap: <row-gap> <column-gap>;

        /* 3.3 gap 属性 */
        .container {
          gap: 20px 20px;
        }

        /* 3.4 grid-template-areas 属性 */
        .container {
          display: grid;
          grid-template-columns: 100px 100px 100px;
          grid-template-rows: 100px 100px 100px;
          grid-template-areas:
            'a b c'
            'd e f'
            'g h i';
        }

        /* 3.4 grid-template-areas 属性 */
        grid-template-areas:
          'a a a'
          'b b b'
          'c c c';

        /* 3.4 grid-template-areas 属性 */
        grid-template-areas:
          'a . c'
          'd . f'
          'g . i';

        /* 3.5 grid-auto-flow 属性 */
        grid-auto-flow: column;

        /* 3.5 grid-auto-flow 属性 */
        grid-auto-flow: row dense;

        /* 3.5 grid-auto-flow 属性 */
        grid-auto-flow: column dense;

        /* 3.6 justify-items 属性， align-items 属性， place-items 属性 */
        .container {
          justify-items: start | end | center | stretch;
          align-items: start | end | center | stretch;
        }

        /* 3.6 justify-items 属性， align-items 属性， place-items 属性 */
        .container {
          justify-items: start;
        }

        /* 3.6 justify-items 属性， align-items 属性， place-items 属性 */
        .container {
          align-items: start;
        }

        /* 3.6 justify-items 属性， align-items 属性， place-items 属性 */
        place-items: <align-items> <justify-items>;

        /* 3.7 justify-content 属性， align-content 属性， place-content 属性 */
        .container {
          justify-content: start | end | center | stretch | space-around | space-between
            | space-evenly;
          align-content: start | end | center | stretch | space-around | space-between |
            space-evenly;
        }

        /* 3.7 justify-content 属性， align-content 属性， place-content 属性 */
        place-content: <align-content> <justify-content>;

        /* 3.8 grid-auto-columns 属性， grid-auto-rows 属性 */
        .container {
          display: grid;
          grid-template-columns: 100px 100px 100px;
          grid-template-rows: 100px 100px 100px;
          grid-auto-rows: 50px;
        }

        /* 4.1 grid-column-start / end, grid-row-start / end */
        .item-1 {
          grid-column-start: 2;
          grid-column-end: 4;
        }

        /* 4.1 grid-column-start / end, grid-row-start / end */
        .item-1 {
          grid-column-start: span 2;
        }

        /* 4.2 grid-column 属性， grid-row 属性 */
        .item {
          grid-column: <start-line> / <end-line>;
          grid-row: <start-line> / <end-line>;
        }

        /* 4.2 grid-column 属性， grid-row 属性 */
        .item-1 {
          grid-column: 1 / 3;
          grid-row: 1 / 2;
        }

        /* 4.3 grid-area 属性 */
        .item-1 {
          grid-area: e;
        }

        /* 4.3 grid-area 属性 */
        .item {
          grid-area: <row-start> / <column-start> / <row-end> / <column-end>;
        }

        /* 4.4 justify-self 属性， align-self 属性， place-self 属性 */
        .item {
          justify-self: start | end | center | stretch;
          align-self: start | end | center | stretch;
        }

        /* 4.4 justify-self 属性， align-self 属性， place-self 属性 */
        place-self: <align-self> <justify-self>;
    </style>
</head>
<body>
    <h3>3.1 display: grid</h3>
    <div style="display:grid;grid-template-columns:80px 80px 80px;gap:8px;">
      <div style="background:#1677ff;color:#fff;padding:10px;">1</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">2</div>
      <div style="background:#faad14;color:#fff;padding:10px;">3</div>
      <div style="background:#1677ff;color:#fff;padding:10px;">4</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">5</div>
      <div style="background:#faad14;color:#fff;padding:10px;">6</div>
    </div>

    <h3>3.2 grid-template-columns: 100px 100px 100px</h3>
    <div style="display:grid;grid-template-columns:100px 100px 100px;grid-template-rows:100px 100px 100px;gap:4px;">
      <div style="background:#1677ff;color:#fff;">1</div>
      <div style="background:#52c41a;color:#fff;">2</div>
      <div style="background:#faad14;color:#fff;">3</div>
      <div style="background:#1677ff;color:#fff;">4</div>
      <div style="background:#52c41a;color:#fff;">5</div>
      <div style="background:#faad14;color:#fff;">6</div>
      <div style="background:#1677ff;color:#fff;">7</div>
      <div style="background:#52c41a;color:#fff;">8</div>
      <div style="background:#faad14;color:#fff;">9</div>
    </div>

    <h3>3.2 fr 单位（1fr 1fr）</h3>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
      <div style="background:#1677ff;color:#fff;padding:10px;">1fr</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">1fr</div>
    </div>

    <h3>3.3 gap 间距</h3>
    <div style="display:grid;grid-template-columns:100px 100px;gap:20px;">
      <div style="background:#1677ff;color:#fff;padding:10px;">1</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">2</div>
      <div style="background:#faad14;color:#fff;padding:10px;">3</div>
      <div style="background:#1677ff;color:#fff;padding:10px;">4</div>
    </div>

    <h3>3.4 grid-template-areas</h3>
    <div style="display:grid;grid-template-columns:100px 100px 100px;grid-template-rows:100px 100px;grid-template-areas:'a b c' 'd e f';gap:4px;">
      <div style="grid-area:a;background:#1677ff;color:#fff;">a</div>
      <div style="grid-area:b;background:#52c41a;color:#fff;">b</div>
      <div style="grid-area:c;background:#faad14;color:#fff;">c</div>
      <div style="grid-area:d;background:#1677ff;color:#fff;">d</div>
      <div style="grid-area:e;background:#52c41a;color:#fff;">e</div>
      <div style="grid-area:f;background:#faad14;color:#fff;">f</div>
    </div>

    <h3>4.1 grid-column: span 2</h3>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px;">
      <div class="item-1" style="background:#1677ff;color:#fff;padding:10px;">span 2</div>
      <div style="background:#52c41a;color:#fff;padding:10px;">3</div>
      <div style="background:#faad14;color:#fff;padding:10px;">4</div>
    </div>
</body>
</html>
