<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>tableLayout</title>
    <style>
        /* 1.1 核心属性：表格布局算法 (table-layout) */
        table {
          width: 100%;
          table-layout: fixed;
        }

        /* 1.2 边框模型 (border-collapse) */
        table {
          /* 现代表格标配 */
          border-collapse: collapse;
        }
        th,
        td {
          border: 1px solid #ccc;
        }

        /* 1.2 边框模型 (border-collapse) */
        table {
          border-collapse: separate;
        }
        th,
        td {
          border: 1px solid #ccc;
        }

        /* 1.3 间距与位置 */
        table {
          border-collapse: separate;
          border-spacing: 2px;
        }

        th,
        td {
          border: 1px solid #ccc;
        }

        /* 1.3 间距与位置 */
        table {
          border-collapse: collapse;
          caption-side: top;
        }

        th,
        td {
          border: 1px solid #ccc;
        }

        /* 垂直居中 (Vertical Centering) */
        .parent {
          display: table;
          height: 300px;
        }
        .child {
          display: table-cell;
          vertical-align: middle; /* 内容完美垂直居中 */
          text-align: center; /* 水平居中 */
        }

        /* 多列等高布局 (Equal Height Columns) */
        .row {
          display: table;
          width: 100%;
        }
        .col-left,
        .col-right {
          display: table-cell;
          /* 不需要写 height: 100%，它们自动等高 */
        }

        /* 3.1 表格里的文字怎么实现“单行省略号” (...)？ */
        table {
          width: 100%;
          table-layout: fixed; /* 1. 关键 */
        }

        td.truncate {
          white-space: nowrap; /* 2 */
          overflow: hidden; /* 3 */
          text-overflow: ellipsis; /* 4 */
        }

        /* 3.2 如何做响应式表格 (适配手机端)？ */
        .table-wrapper {
          overflow-x: auto;
          -webkit-overflow-scrolling: touch; /* iOS 顺滑滚动 */
        }

        /* 3.2 如何做响应式表格 (适配手机端)？ */
        @media (max-width: 600px) {
          table,
          thead,
          tbody,
          th,
          td,
          tr {
            display: block; /* 强制破坏表格结构 */
          }
          thead {
            display: none; /* 隐藏表头 */
          }
          td {
            position: relative;
            padding-left: 50%; /* 留出位置给标题 */
          }
          /* 利用伪元素显示标题 (需 HTML: <td data-label="姓名">) */
          td::before {
            content: attr(data-label);
            position: absolute;
            left: 10px;
            font-weight: bold;
          }
        }

        /* 3.4 如何固定表头 (Sticky Header)？ */
        th {
          position: sticky;
          top: 0;
          z-index: 2; /* 防止被内容遮挡 */
          background-color: #fff; /* 必须给表头加背景色，否则是透明的 */
        }
    </style>
</head>
<body>
    <h3>1.1 table-layout: fixed</h3>
    <table>
      <tr><th>姓名</th><th>年龄</th><th>地址</th></tr>
      <tr><td>小红</td><td>18</td><td>北京</td></tr>
      <tr><td>小明</td><td>19</td><td>上海</td></tr>
    </table>

    <h3>3.1 单行省略号</h3>
    <table>
      <tr><td class="truncate">这段文字很长很长很长很长会被省略号截断显示</td></tr>
    </table>

    <h3>3.2 响应式表格（横向滚动）</h3>
    <div class="table-wrapper">
      <table><tr><th>列1</th><th>列2</th><th>列3</th><th>列4</th><th>列5</th></tr><tr><td>1</td><td>2</td><td>3</td><td>4</td><td>5</td></tr></table>
    </div>

    <h3>垂直居中（table-cell）</h3>
    <div class="parent" style="height:120px;width:200px;background:#d9f0ff;">
      <div class="child">垂直居中内容</div>
    </div>

    <h3>多列等高布局</h3>
    <div class="row">
      <div class="col-left" style="background:#d9f0ff;padding:10px;">左列<br>内容少</div>
      <div class="col-right" style="background:#fff1b8;padding:10px;">右列<br>内容多<br>内容多</div>
    </div>
</body>
</html>
