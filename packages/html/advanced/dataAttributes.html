<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>dataAttributes</title>
    <style>
        /* 1.3 jQuery API */
        article[data-columns='3'] {
          column-count: 3;
        }

        article[data-parent='cars'] {
          border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <!-- 1.1 语法 -->
    <article
      id="electric-cars"
      data-columns="3"
      data-index-number="12314"
      data-parent="cars"
    >
      ...
    </article>
    <script>
        // ===== 1.3 jQuery API =====
        // // 获取 data-columns 的值
        // const columns = $('#electric-cars').data('columns') // 3 (jQuery 会尝试将字符串转换为数字)
        //
        // // 设置 data-columns 的值 (注意：这不会改变 HTML 属性)
        // $('#electric-cars').data('columns', 5)
    </script>
</body>
</html>
