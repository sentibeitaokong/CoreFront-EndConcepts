<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>semanticHtml</title>
</head>
<body>
    <!-- 3. 语义化布局实战案例 -->
    <!-- 1. 网站头部 -->
      <header>
        <h1>我的技术博客</h1>
        <nav>
          <ul>
            <li><a href="/">首页</a></li>
            <li><a href="/about">关于</a></li>
          </ul>
        </nav>
      </header>

      <div class="container">
        <!-- 2. 页面主体 (左侧) -->
        <main>
          <!-- 一篇完整的文章 -->
          <article>
            <header>
              <h2>HTML5 语义化详解</h2>
              <p>作者: 张三 | <time datetime="2023-10-24">2023年10月24日</time></p>
            </header>

            <section>
              <h3>第一章: 为什么需要语义化?</h3>
              <p>...</p>
            </section>

            <section>
              <h3>第二章: 常用标签</h3>
              <p>...</p>
            </section>

            <footer>
              <p>版权所有，转载请注明出处。</p>
            </footer>
          </article>

          <!-- 评论区 (也是独立内容，可用 article 或 section) -->
          <section class="comments">
            <h3>评论</h3>
            <article class="comment">...</article>
            <article class="comment">...</article>
          </section>
        </main>

        <!-- 3. 侧边栏 (右侧) -->
        <aside>
          <h3>热门文章</h3>
          <ul>
            ...
          </ul>
          <h3>广告位</h3>
          <div>...</div>
        </aside>
      </div>

      <!-- 4. 网站底部 -->
      <footer>
        <p>&copy; 2023 My Blog. All rights reserved.</p>
      </footer>
</body>
</html>
